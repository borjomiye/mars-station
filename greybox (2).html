/* ============================== 3. ENGINE ============================== */
const PHASE = { BRIEFING: 'briefing', PLAN: 'plan', EVENT: 'event', RESULTS: 'results', RADIO: 'radio', REPORT: 'report' };
// Машина состояний сола: какие переходы разрешены.
const TRANSITIONS = {

  plan:     ['event', 'results'],
  event:    ['plan', 'results'],
  results:  ['radio', 'briefing', 'report'],
  radio:    ['briefing', 'report'],
  report:   [],
};
function go(s, to) {
  if (!TRANSITIONS[s.phase].includes(to)) throw new Error('Bad transition ' + s.phase + ' -> ' + to);
  s.phase = to; return s;
}

const clone = o => JSON.parse(JSON.stringify(o));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r3 = v => Math.round(v * 1000) / 1000;
const fmt = v => (Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v)) : (Math.round(v * 10) / 10).toFixed(1));
const fmt2 = v => v.toFixed(2);
const signed = v => (v > 0 ? '+' : '−') + fmt(Math.abs(v));
const plural = (n, w) => fmt(n) + ' ' + w + (Math.abs(n - 1) < 1e-9 ? '' : 's');
const wordCount = t => String(t).trim().split(/\s+/).filter(Boolean).length;
function line15(t) { if (wordCount(t) > 15) console.warn('Over 15 words:', t); return t; }
function cfg(mode) { return Object.assign({}, CONFIG, MODE_OVERRIDES[mode] || {}); }

// --- сидированный ГСЧ: используется только при создании миссии ---
function hashSeed(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^ (h >>> 16)) >>> 0;
}
function makeRng(seed) {
  let a = hashSeed(seed);
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function normSeed(name) { return String(name || '').toLowerCase().replace(/\s+/g, ' ').trim().replace(/^mission /, '') || 'brave otter'; }
function prettyName(name) { return normSeed(name).split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' '); }
function randomMissionName() { return NAME_A[Math.floor(Math.random() * NAME_A.length)] + ' ' + NAME_B[Math.floor(Math.random() * NAME_B.length)]; }

// --- расписание миссии: погода, события, реальная космическая погода. Не зависит от режима. ---
function buildSchedule(seed) {
  const c = CONFIG, rng = makeRng(seed), N = c.MISSION_SOLS;
  const ri = (a, b) => a + Math.floor(rng() * (b - a + 1));
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  const days = [];
  for (let i = 1; i <= N; i++) days.push({ sol: i, kind: 'quiet', eventId: null, weather: 'clear', storm: null, real: [], sickIdx: ri(0, CREW.length - 1) });
  const setEv = (sol, kind, id) => { const d = days[sol - 1]; if (d && !d.eventId && id) { d.kind = kind; d.eventId = id; } };

  // 1) окно DONKI: сдвиг подбирается так, чтобы буря попала в разрешённые солы
  const win = DONKI_WINDOWS[Math.floor(rng() * DONKI_WINDOWS.length)];
  const dayIdx = d => Math.round((Date.parse(d + 'T00:00:00Z') - Date.parse(win.start + 'T00:00:00Z')) / 86400000);
  const stormLen = c.STORM_MULT_BY_DAY.length, offsets = [];
  for (let o = 0; o <= win.days - N; o++) {
    const seps = win.events.filter(e => e.type === 'SEP').map(e => dayIdx(e.date) - o + 1).filter(sol => sol >= 1 && sol <= N);
    if (seps.length && seps.every(sol => sol >= c.STORM_MIN_SOL && sol <= c.STORM_MAX_SOL)) offsets.push(o);
  }
  const off = offsets.length ? offsets[Math.floor(rng() * offsets.length)] : 0;
  for (const e of win.events) {
    const sol = dayIdx(e.date) - off + 1;
    if (sol < 1 || sol > N) continue;
    days[sol - 1].real.push({ type: e.type, date: e.date, label: e.label, seenAt: e.seenAt, source: win.source, verified: win.verified });
    if (e.type === 'SEP') for (let k = 0; k < stormLen && sol + k <= N; k++) {
      const d = days[sol - 1 + k];
      if (!d.storm) { d.storm = { day: k, date: e.date, label: e.label, verified: win.verified }; d.kind = 'trouble'; d.eventId = 'solar_storm'; }
    }
  }
  // 2) погода и пылевая буря
  for (const d of days) if (d.sol > c.CLEAR_UNTIL_SOL) d.weather = rng() < c.HAZY_CHANCE ? 'hazy' : 'clear';
  const dustLen = ri(c.DUST_LEN_MIN, c.DUST_LEN_MAX);
  let starts = [];
  for (let sol = c.DUST_START_MIN; sol <= c.DUST_START_MAX; sol++) if (sol < N && !days[sol - 1].eventId) starts.push(sol);
  if (!starts.length) for (let sol = c.FIRST_CHANCE_SOL + 1; sol < N; sol++) if (!days[sol - 1].eventId) starts.push(sol);
  const dustPick = rng();
  if (starts.length) {
    const st = starts[Math.floor(dustPick * starts.length)];
    setEv(st, 'trouble', 'dust_storm');
    for (let k = 0; k < dustLen && st + k <= N; k++) days[st - 1 + k].weather = 'dust';
  }
  // 3) обучающие солы и фиксированные слоты
  days[0].kind = 'intro';
  setEv(c.TUTORIAL_TROUBLE_SOL, 'trouble', c.TUTORIAL_TROUBLE);
  if (!days[2].eventId) days[2].kind = 'intro';
  const chances = shuffle(c.CHANCE_POOL), troubles = shuffle(c.TROUBLE_POOL);
  const fi = chances.findIndex(x => x !== 'clean_wind');
  setEv(c.FIRST_CHANCE_SOL, 'chance', chances.splice(fi, 1)[0]);
  if (!days[N - 1].eventId) days[N - 1].kind = 'ship';
  // 4) остальные солы: поломки, шансы, тихие
  const free = days.filter(d => d.sol > c.FIRST_CHANCE_SOL && d.sol < N && !d.eventId && d.kind === 'quiet').map(d => d.sol);
  let kinds = [];
  for (let i = 0; i < c.RANDOM_TROUBLES; i++) kinds.push('trouble');
  for (let i = 0; i < c.CHANCES_TOTAL - 1; i++) kinds.push('chance');
  while (kinds.length > free.length) kinds.pop();
  while (kinds.length < free.length) kinds.push('quiet');
  kinds = shuffle(kinds);
  free.forEach((sol, i) => {
    if (kinds[i] === 'trouble') setEv(sol, 'trouble', troubles.shift());
    else if (kinds[i] === 'chance') setEv(sol, 'chance', chances.shift());
  });
  return days;
}

// --- запросы к состоянию ---
function dayOf(s, sol) { return s.schedule[(sol === undefined ? s.sol : sol) - 1] || null; }
function crewById(s, id) { return s.crew.find(p => p.id === id) || null; }
function cardDef(id) { return CARDS.find(k => k.id === id); }
function isUnlocked(s, sys) { return s.sol >= cfg(s.mode).SYSTEMS[sys].unlockSol; }
function isBlackout(s, sol) { return cfg(s.mode).BLACKOUT_SOLS.includes(sol === undefined ? s.sol : sol); }
function stormOn(s, sol) { const d = dayOf(s, sol); if (!d || !d.storm) return null; return { mult: cfg(s.mode).STORM_MULT_BY_DAY[d.storm.day] || 1, day: d.storm.day, date: d.storm.date, label: d.storm.label }; }
function badgeOf(c, dose) { return dose >= c.BADGE_RED_MSV ? 'red' : dose >= c.BADGE_AMBER_MSV ? 'amber' : 'green'; }
function problemNeed(c, p) { return Math.max(c.MIN_REPAIR_WORK, c.PROBLEMS[p.type].work + (p.severity - 1) * c.WORK_PER_SEVERITY - p.advice); }
function problemEffect(c, p) {
  const d = c.PROBLEMS[p.type];
  if (d.airLeak) return 'air & water −' + d.airLeak * p.severity;
  if (d.growthFactor) return 'crops grow at x' + d.growthFactor[p.severity - 1];
  if (d.blocksRadio) return 'no radio';
  if (d.cellsLost) return '−' + plural(d.cellsLost * p.severity, 'cell');
  return '';
}
function radioBlocked(s) { const c = cfg(s.mode); return s.problems.some(p => c.PROBLEMS[p.type].blocksRadio); }
function currentEvent(s) {
  const d = dayOf(s);
  if (!d || !d.eventId || s.today.skipEvent) return null;
  if (d.kind === 'trouble') return { kind: 'trouble', id: d.eventId, def: TROUBLES[d.eventId] };
  if (d.kind === 'chance') return { kind: 'chance', id: d.eventId, def: CHANCES[d.eventId] };
  return null;
}
function cellsAvailable(s) {
  const c = cfg(s.mode), ch = s.today.choice;
  return s.supply + (ch && ch.id === 'use_now' ? c.WIND_BONUS_CELLS : 0);
}
function planTotal(plan) { return SYS_KEYS.reduce((a, k) => a + (plan.cells[k] || 0), 0); }
function jobAllowed(s, p, j) {
  const c = cfg(s.mode);
  if (p.medbay > 0) return { ok: false, why: 'in the medbay' };
  if (s.sol < c.JOB_UNLOCK_SOL) return { ok: j === 'rest', why: 'jobs open on sol ' + c.JOB_UNLOCK_SOL };
  if (j === 'outside' && p.grounded) return { ok: false, why: 'red badge: stays inside' };
  if (j === 'lab' && !isUnlocked(s, 'lab')) return { ok: false, why: 'lab opens on sol ' + c.SYSTEMS.lab.unlockSol };
  return { ok: true, why: '' };
}
function sanitizePlan(s, plan) {
  const c = cfg(s.mode), cells = {}, jobs = {};
  for (const k of SYS_KEYS) {
    let v = Math.floor(Number(plan.cells && plan.cells[k]) || 0);
    v = isUnlocked(s, k) ? clamp(v, 0, c.SYSTEMS[k].max) : 0;
    if (k === 'radio' && isBlackout(s)) v = 0;
    cells[k] = v;
  }
  let total = SYS_KEYS.reduce((a, k) => a + cells[k], 0);
  const avail = cellsAvailable(s);
  // без бури щит бесполезен, поэтому он обрезается первым
  const order = stormOn(s) ? c.TRIM_ORDER : ['shield'].concat(c.TRIM_ORDER.filter(k => k !== 'shield'));
  for (const k of order) while (total > avail && cells[k] > 0) { cells[k]--; total--; }
  for (const p of s.crew) {
    let j = plan.jobs && plan.jobs[p.id];
    if (!JOB_KEYS.includes(j) || !jobAllowed(s, p, j).ok) j = 'rest';
    jobs[p.id] = j;
  }
  return { cells, jobs };
}
// Ячейки с учётом события (перегоревший предохранитель).
function effectiveCells(s) {
  const cells = Object.assign({}, s.plan.cells), ch = s.today.choice;
  if (ch && s.today.revealed) {
    if (ch.id === 'dark_greenhouse') cells.greenhouse = 0;
    if (ch.id === 'dark_labradio') { cells.lab = 0; cells.radio = 0; }
  }
  return cells;
}
// Работы с учётом медотсека и выбора в событии.
function effectiveJobs(s) {
  const c = cfg(s.mode), out = {}, ev = currentEvent(s), ch = s.today.choice;
  for (const p of s.crew) {
    let j = s.plan.jobs[p.id] || 'rest';
    if (s.sol < c.JOB_UNLOCK_SOL) j = 'rest';
    if (j === 'outside' && p.grounded) j = 'rest';
    if (p.medbay > 0) j = 'medbay';
    out[p.id] = j;
  }
  if (ev && ch && s.today.revealed) {
    if (ch.job) for (const id of ch.crew) if (out[id] !== 'medbay') out[id] = ch.job;
    if (ev.id === 'solar_storm') {
      if (ch.id === 'shelter_all') for (const p of s.crew) if (out[p.id] !== 'medbay') out[p.id] = 'shelter';
      if (ch.id === 'indoors') for (const p of s.crew) if (out[p.id] === 'outside') out[p.id] = 'rest';
    }
    if (ev.id === 'sick_crew' && s.today.sickId) {
      if (ch.id === 'medbay_now') out[s.today.sickId] = 'medbay';
      if (ch.id === 'bed_rest') out[s.today.sickId] = 'rest';
    }
    if (ch.id === 'scan') { const sci = s.crew.find(p => p.role === 'scientist'); if (sci && out[sci.id] !== 'medbay') out[sci.id] = 'scan'; }
  }
  return out;
}
// Доза за сол: { d: всего, extra: сверх обычного из-за бури }.
function doseFor(c, storm, job, shieldCells) {
  const base = c.DOSE_INDOOR_PER_SOL, out = job === 'outside';
  if (!storm) return { d: base + (out ? c.DOSE_OUTSIDE_TRIP : 0), extra: 0 };
  if (out) { const d = (base + c.DOSE_OUTSIDE_TRIP) * storm.mult; return { d, extra: d - base - c.DOSE_OUTSIDE_TRIP }; }
  const gap = 1 - Math.min(1, shieldCells / c.SYSTEMS.shield.want);
  const exposure = gap * (job === 'shelter' || job === 'medbay' ? c.SHELTER_EXPOSURE : 1);
  const d = base * (1 + (storm.mult - 1) * exposure);
  return { d, extra: d - base };
}
function workPower(c, p, kind) {
  return c.JOB_OUTPUT[kind] * (c.SPECIALIST_OF[p.role] === kind ? c.SPECIALIST_MULT : 1) * (p.cond === 'tired' ? c.TIRED_EFFECT : 1) * (p.sick ? c.SICK_EFFECT : 1);
}

// --- мутирующие помощники (работают только с клоном внутри функций движка) ---
function addProblem(s, type) {
  const old = s.problems.find(p => p.type === type), c = cfg(s.mode);
  if (old) { old.severity = Math.min(c.PROBLEMS[type].maxSeverity, old.severity + 1); return old; }
  const p = { uid: ++s.uid, type, severity: 1, done: 0, age: 0, advice: 0 };
  s.problems.push(p); return p;
}
function enterMedbay(s, p, steps, cause) {
  p.medbay = steps; p.sick = false; p.sickRest = 0; p.heavyStreak = 0;
  if (!p.medbayCause) p.medbayCause = cause;
  s.plan.jobs[p.id] = 'rest';
}
function findCard(s, id, say, why) {
  if (!id || s.cards.found.includes(id)) return false;
  s.cards.found.push(id);
  if (say) say('Card found: ' + cardDef(id).title, why);
  return true;
}
function know(s, sol) { if (sol <= cfg(s.mode).MISSION_SOLS && !s.known.includes(sol)) s.known.push(sol); }
function forecastFor(s, sol) {
  const d = dayOf(s, sol), c = cfg(s.mode), st = stormOn(s, sol);
  return { sol, weather: d.weather, cells: c.CELLS_BY_WEATHER[d.weather], storm: st ? st.mult : null };
}
function setSupply(s) {
  const c = cfg(s.mode), d = dayOf(s);
  let v = c.CELLS_BY_WEATHER[d.weather];
  const notes = [d.weather + ' sky ' + v];
  for (const p of s.problems) { const pd = c.PROBLEMS[p.type]; if (pd.cellsLost) { v -= pd.cellsLost * p.severity; notes.push(pd.name.toLowerCase() + ' −' + pd.cellsLost * p.severity); } }
  if (s.panelBoost && s.sol <= s.panelBoost.until) { v += s.panelBoost.cells; notes.push('polished panels +' + s.panelBoost.cells); }
  if (s.battery > 0) { v += s.battery; notes.push('battery +' + s.battery); s.battery = 0; }
  s.supply = Math.max(0, v); s.supplyNotes = notes;
}
function deliverAnswer(s, m) {
  const c = cfg(s.mode);
  if (m.id === 'forecast') {
    for (let k = 1; k <= c.RADIO_FORECAST_SOLS; k++) know(s, s.sol + k);
    return 'Earth sent the space weather forecast. See it below.';
  }
  if (m.id === 'fix') {
    const p = s.problems[0];
    if (!p) return 'Earth says: "Your call, Captain."';
    p.advice += 1;
    return 'Earth sent a repair trick. ' + c.PROBLEMS[p.type].name + ' needs less work.';
  }
  if (m.id === 'doctors') {
    findCard(s, 'bones');
    const pat = s.crew.filter(p => p.medbay > 0).sort((a, b) => b.medbay - a.medbay)[0];
    if (pat) {
      pat.medbay = Math.max(0, pat.medbay - 1);
      if (pat.medbay <= 0) { pat.cond = 'fine'; return 'The doctors helped. ' + pat.name + ' leaves the medbay today.'; }
      return 'The doctors helped. ' + pat.name + ' heals one sol sooner.';
    }
    const ill = s.crew.find(p => p.sick);
    if (ill) { ill.sickRest += 1; return 'The doctors helped. ' + ill.name + ' needs less bed rest.'; }
    return 'Earth says: "Your call, Captain."';
  }
  return 'Earth got your science report. Thank you!';
}

// --- начало нового сола (утро) ---
function nextSol(s) {
  const c = cfg(s.mode), prev = s.sol >= 1 ? dayOf(s) : null, last = s.log[s.log.length - 1];
  if (s.sol >= 1) go(s, PHASE.BRIEFING); else s.phase = PHASE.BRIEFING;
  s.sol++;
  const day = dayOf(s), M = { lines: [], notes: [], answers: [], unlocked: [], words: [] };
  if (s.sol === 1) {
    M.lines.push('Landing done. The station is running.');
    M.lines.push('The ship home lands on sol ' + c.MISSION_SOLS + '.');
  } else {
    M.lines.push(last && last.harvests ? 'Harvest came in. New crop is at ' + fmt(s.crop) + ' of ' + c.CROP_STEPS_TO_HARVEST + ' steps.' : 'Greenhouse: crop is at ' + fmt(s.crop) + ' of ' + c.CROP_STEPS_TO_HARVEST + ' steps.');
    M.lines.push(s.problems.length ? 'Open trouble: ' + s.problems.map(p => c.PROBLEMS[p.type].name).join(', ') + '.' : 'Hull is holding. Nothing is broken.');
    const med = s.crew.filter(p => p.medbay > 0);
    M.lines.push(med.length ? 'In the medbay: ' + med.map(p => p.name).join(', ') + '.' : 'Nobody is in the medbay.');
  }
  if (prev && prev.weather === 'dust' && day.weather !== 'dust') {
    if (!s.flags.panelsCovered) { addProblem(s, 'dusty_panels'); M.notes.push('Dust storm is over. Panels are dusty: fewer cells.'); }
    else M.notes.push('Dust storm is over. The panels stayed clean.');
    s.flags.panelsCovered = false;
  }
  // ответ Земли приходит утром, если связь есть
  if (s.radio.queue.length) {
    if (isBlackout(s)) M.answers.push('No word from Earth. The Sun is in the way.');
    else if (radioBlocked(s)) M.answers.push('No word from Earth. The antenna is off.');
    else { for (const m of s.radio.queue) M.answers.push(deliverAnswer(s, m)); s.radio.queue = []; }
  }
  for (let k = 1; k <= c.AUTO_FORECAST_SOLS; k++) know(s, s.sol + k);
  for (const k of SYS_KEYS) if (c.SYSTEMS[k].unlockSol === s.sol && s.sol > 1) M.unlocked.push(c.SYSTEMS[k].name);
  if (s.sol === c.JOB_UNLOCK_SOL) M.unlocked.push('Crew jobs');
  const word = k => { if (!s.seenWords.includes(k)) { s.seenWords.push(k); M.words.push(WORDS[k]); } };
  if (s.sol === 1) { word('sol'); word('cell'); }
  if (s.sol === c.SYSTEMS.shield.unlockSol) word('msv');
  if (day.real.some(e => e.type === 'FLR')) word('flare');
  if (day.storm) word('sep');
  if (isBlackout(s)) word('conj');
  setSupply(s);
  s.today = { revealed: false, choice: null, sickId: null, skipEvent: false, before: null };
  // вчерашний план — стартовая точка сегодняшнего
  if (s.flags.prefill) {
    const pr = s.problems.find(p => p.type === s.flags.prefill);
    if (pr) {
      const job = c.PROBLEMS[pr.type].where === 'outside' ? 'outside' : 'fix';
      const pool = s.crew.filter(p => jobAllowed(s, p, job).ok && !p.sick && p.cond !== 'tired');
      const who = pool.find(p => p.role === 'engineer') || pool[0];
      if (who) { s.plan.jobs[who.id] = job; M.notes.push(who.name + ' is set to fix the ' + c.PROBLEMS[pr.type].name.toLowerCase() + ' today.'); }
    }
    s.flags.prefill = null;
  }
  s.plan = sanitizePlan(s, s.plan);
  M.lines.forEach(line15); M.notes.forEach(line15); M.answers.forEach(line15);
  s.morning = M;
  return s;
}

// --- публичный API движка ---
function createMission(name, mode) {
  mode = mode === 'commander' ? 'commander' : 'cadet';
  const seed = normSeed(name), c = cfg(mode);
  const s = {
    v: 1, name: prettyName(name), seed, mode, sol: 0, phase: PHASE.BRIEFING,
    air: c.AIR_START, food: c.FOOD_START, crop: 0, samples: 0, labWork: 0, science: 0,
    crew: CREW.map(d => ({ id: d.id, name: d.name, role: d.role, cond: 'fine', sick: false, sickRest: 0, medbay: 0, medbaySols: 0, medbayCause: '', dose: 0, stormExtra: 0, trips: 0, heavyStreak: 0, grounded: false })),
    problems: [], uid: 0, schedule: buildSchedule(seed),
    supply: 0, supplyNotes: [], battery: 0, panelBoost: null,
    plan: { cells: { life: c.SYSTEMS.life.want, shield: 0, greenhouse: c.SYSTEMS.greenhouse.want, radio: 0, lab: 0 }, jobs: {} },
    today: { revealed: false, choice: null, sickId: null, skipEvent: false, before: null },
    radio: { queue: [], sent: 0 }, known: [], cards: { found: [], sent: [] },
    morning: null, lastResults: [], log: [], seenWords: [],
    flags: { panelsCovered: false, prefill: null },
    counters: { airZero: 0, foodZero: 0, harvests: 0, medbaySols: 0 }, over: null,

}
function getMorning(s) {
  const st = stormOn(s);
  return {
    sol: s.sol, weather: dayOf(s).weather, cells: s.supply, cellNotes: s.supplyNotes, storm: st, real: dayOf(s).real, blackout: isBlackout(s),
    lines: s.morning.lines, notes: s.morning.notes, answers: s.morning.answers, unlocked: s.morning.unlocked, words: s.morning.words,
    forecast: s.known.filter(n => n > s.sol).sort((a, b) => a - b).map(n => forecastFor(s, n)),
  };
}
function startPlanning(state) { if (state.phase !== PHASE.BRIEFING) return state; return go(clone(state), PHASE.PLAN); }
function applyPlan(state, plan) {
  if (state.phase !== PHASE.PLAN) return state;
  const s = clone(state);
  s.plan = sanitizePlan(s, plan);
  const ch = s.today.choice;
  if (ch) { // выбор события мог стать недействительным (например, скан без питания лаборатории)
    const def = eventChoices(s).find(x => x.id === ch.id);
    if (!def || !def.enabled) { s.today.choice = null; s.plan = sanitizePlan(s, s.plan); }
  }
  return s;
}
// Событие открывается после первого подтверждения плана.
function revealEvent(s) {
  if (s.today.revealed) return;
  s.today.revealed = true;
  const ev = currentEvent(s);
  if (!ev) return;
  if (ev.kind === 'trouble' && ev.def.problem) addProblem(s, ev.def.problem);
  if (ev.id === 'sick_crew') {
    const n = s.crew.length, start = dayOf(s).sickIdx;
    for (let k = 0; k < n; k++) { const p = s.crew[(start + k) % n]; if (p.medbay <= 0 && !p.sick) { s.today.sickId = p.id; break; } }
    if (!s.today.sickId) s.today.skipEvent = true;
  }
  if (ev.id === 'clean_wind') s.problems = s.problems.filter(p => p.type !== 'dusty_panels');
}
function confirmPlan(state) {
  if (state.phase !== PHASE.PLAN) return state;
  const s = clone(state);
  revealEvent(s);
  if (currentEvent(s)) return go(s, PHASE.EVENT);
  return playSol(s).state;
}
function backToPlan(state) { if (state.phase !== PHASE.EVENT) return state; return go(clone(state), PHASE.PLAN); }
function clearChoice(state) { const s = clone(state); s.today.choice = null; s.plan = sanitizePlan(s, s.plan); return s; }

// Варианты выбора в событии: цена «+» и «−», нужен ли экипаж.
function eventChoices(s) {
  const c = cfg(s.mode), ev = currentEvent(s), out = [];
  if (!ev || !s.today.revealed) return out;
  const free = s.crew.filter(p => p.medbay <= 0), canOut = free.filter(p => !p.grounded);
  const add = (id, label, plus, minus, extra) => out.push(Object.assign({ id, label, plus, minus, pick: null, enabled: true, why: '', dose: null }, extra || {}));
  const outPick = (task, max) => ({ pick: { job: 'outside', task, min: 1, max }, enabled: canOut.length > 0, why: 'Nobody can go outside' });
  if (ev.kind === 'trouble' && ev.def.problem) {
    const pr = s.problems.find(p => p.type === ev.def.problem), pd = c.PROBLEMS[ev.def.problem], eff = pr ? problemEffect(c, pr) : '';
    if (pd.where === 'outside') add('fix_now', 'Send crew outside now', 'Fixed today with enough hands', 'They get extra dose and drop their jobs', outPick('repair', 2));
    else add('fix_now', 'Fix it now', 'Fixed today with enough hands', 'They drop today\'s jobs', { pick: { job: 'fix', task: 'repair', min: 1, max: 2 }, enabled: free.length > 0, why: 'Nobody is free' });
    add('tomorrow', 'Fix it tomorrow', 'Today\'s plan stays. A fixer is set for tomorrow', 'Tonight: ' + eff + '. It may grow.');
    add('leave', 'Leave it', 'Costs nothing today', 'Every sol: ' + eff + '. It grows worse.');
  } else if (ev.id === 'solar_storm') {
    const st = stormOn(s), sh = effectiveCells(s).shield, anyOut = s.crew.some(p => p.medbay <= 0 && !p.grounded && s.plan.jobs[p.id] === 'outside');
    add('shelter_all', 'Everyone into the shelter', 'Less dose if the shield is weak', 'Nobody works today', { dose: doseFor(c, st, 'shelter', sh).d });
    add('indoors', 'Keep working indoors', 'Jobs go on inside', anyOut ? 'Outside trips are called off' : 'Dose depends on shield power', { dose: doseFor(c, st, 'rest', sh).d });
    if (anyOut) add('as_planned', 'Stick to the plan', 'Outside trips go ahead', 'Full storm dose outside', { dose: doseFor(c, st, 'outside', sh).d });
  } else if (ev.id === 'sick_crew') {
    const p = crewById(s, s.today.sickId);
    add('medbay_now', p.name + ' goes to the medbay', 'Healed in ' + c.ILLNESS_MEDBAY_STEPS + ' sols, sooner with care', 'Out of work. No third star');
    add('bed_rest', p.name + ' rests in the bunk', 'No medbay if the rest goes on', 'Needs ' + c.SICK_REST_SOLS_TO_CURE + ' rest sols in a row');
    add('keep_working', p.name + ' keeps working', 'Today\'s job gets done at half power', 'Medbay tonight, for ' + c.SICK_WORK_MEDBAY_STEPS + ' sols');
  } else if (ev.id === 'power_fault') {
    add('dark_greenhouse', 'Greenhouse goes dark today', 'Lab and radio keep power', 'Crops wait. ' + plural(s.plan.cells.greenhouse, 'cell') + ' lost');
    add('dark_labradio', 'Lab and radio go dark today', 'Crops keep growing', 'No science, no message. ' + plural(s.plan.cells.lab + s.plan.cells.radio, 'cell') + ' lost');
    add('rewire', 'Rewire it now', 'Nothing goes dark', 'One crew member drops their job', { pick: { job: 'rewire', task: 'rewire', min: 1, max: 1 }, enabled: free.length > 0, why: 'Nobody is free' });
  } else if (ev.id === 'dust_storm') {
    add('cover', 'Send someone to tilt the panels', 'Panels stay clean after the storm', 'Extra dose. Job dropped', outPick('cover', 1));
    add('wait', 'Wait it out', 'Crew stays inside', 'Dusty panels later: fewer cells');
  } else if (ev.id === 'clean_wind') {
    add('use_now', 'Use the extra power today', '+' + c.WIND_BONUS_CELLS + ' cells today', 'Gone at sunset');
    add('polish', 'Send someone to polish the panels', '+' + c.WIND_POLISH_CELLS + ' cell for ' + c.WIND_POLISH_SOLS + ' sols', 'Extra dose. Job dropped', outPick('polish', 1));
    add('let_go', 'Let it go', 'Costs nothing', 'The panels get dusty again');
  } else if (ev.kind === 'chance') {
    const sci = s.crew.find(p => p.role === 'scientist'), want = c.SYSTEMS.lab.want;
    const labOk = isUnlocked(s, 'lab') && s.plan.cells.lab >= want, sciOk = !!sci && sci.medbay <= 0;
    add('outside', 'Go outside for it', 'Discovery card and a sample', 'Extra dose. Job dropped', outPick('chance', 1));
    add('scan', 'Scan it from the lab', 'Discovery card, nobody goes outside', 'Needs ' + want + ' lab cells and ' + (sci ? sci.name : 'the scientist') + '\'s day',
      { enabled: labOk && sciOk, why: !labOk ? 'The lab has no power. Go back to the plan.' : 'The scientist is in the medbay' });
    add('let_go', 'Let it go', 'Costs nothing', 'The chance is gone by morning');
  }

}
function resolveEvent(state, choiceId, crewIds) {
  if (state.phase !== PHASE.EVENT) return state;
  const s = clone(state), def = eventChoices(s).find(x => x.id === choiceId);
  if (!def || !def.enabled) return s;
  const crew = [];
  if (def.pick) {
    for (const id of crewIds || []) {
      const p = crewById(s, id);
      if (p && !crew.includes(id) && p.medbay <= 0 && !(def.pick.job === 'outside' && p.grounded) && crew.length < def.pick.max) crew.push(id);
    }
    if (crew.length < def.pick.min) return s;
  }
  s.today.choice = { id: choiceId, crew, job: def.pick ? def.pick.job : null, task: def.pick ? def.pick.task : null, label: def.label };
  s.plan = sanitizePlan(s, s.plan);
  return s;
}

// --- главный расчёт сола ---
function playSol(state) {
  if (state.phase !== PHASE.PLAN && state.phase !== PHASE.EVENT) return { state, results: [] };
  const s = clone(state), c = cfg(s.mode), day = dayOf(s), R = [];
  const say = (t, why) => R.push({ t, why: why || '' });
  revealEvent(s);
  const ev = currentEvent(s);
  if (ev && !s.today.choice) { // бот/превью не выбрали: берём последний «ничего не делать»
    const l = eventChoices(s).filter(x => x.enabled && !x.pick), d = l[l.length - 1];
    s.today.choice = { id: d.id, crew: [], job: null, task: null, label: d.label };
  }
  const ch = ev ? s.today.choice : null;
  s.plan = sanitizePlan(s, s.plan);
  s.today.before = { air: s.air, food: s.food, crop: s.crop, science: s.science };
  const jobs = effectiveJobs(s), cells = effectiveCells(s), storm = stormOn(s);
  const rec = { sol: s.sol, supply: cellsAvailable(s), cells, jobs, air: [], harvests: 0, choice: ch ? ev.id + ':' + ch.id : null };
  const names = list => list.map(p => p.name).join(' and ');
  const withJob = j => s.crew.filter(p => jobs[p.id] === j);
  const tank = (key, label, d, why, causeKey) => {
    if (!d) return;
    const b = s[key]; s[key] = clamp(s[key] + d, 0, c.TANK_MAX);
    const real = s[key] - b;
    if (key === 'air') rec.air.push({ d: real, key: causeKey || why });
    if (real !== 0) say(label + ' ' + signed(real) + (real !== d ? (d > 0 ? ' (tank full)' : ' (tank empty)') : ''), why);
    else say(label + (d > 0 ? ' tank is full' : ' tank is empty'), why);
  };
  const air = (d, why, key) => tank('air', 'Air & water', d, why, key);
  const food = (d, why) => tank('food', 'Food', d, why);

  // 0) событие: болезнь
  if (ev && ev.id === 'sick_crew') {
    const p = crewById(s, s.today.sickId);
    if (ch.id === 'medbay_now') { enterMedbay(s, p, c.ILLNESS_MEDBAY_STEPS, 'feeling ill'); say(p.name + ' went to the medbay', 'ill, your choice'); }
    else { p.sick = true; p.sickRest = 0; }
  }
  // 0) событие: предохранитель
  if (ev && ev.id === 'power_fault') {
    if (ch.id === 'dark_greenhouse') say('Greenhouse dark today', 'blown fuse, your choice');
    else if (ch.id === 'dark_labradio') say('Lab and radio dark today', 'blown fuse, your choice');
    else say('Fuse rewired: nothing went dark', names(withJob('rewire')) + ' spent the day on it');
  }

  // 1) ремонт внутри и снаружи; свободные «наружные» собирают образцы
  const repair = (where, workers) => {
    const idle = [];
    workers.sort((a, b) => workPower(c, b, 'fix') - workPower(c, a, 'fix'));
    for (const p of workers) {
      let w = workPower(c, p, 'fix'), did = false;
      for (const pr of s.problems) {
        if (w <= 1e-9) break;
        if (pr.fixed || c.PROBLEMS[pr.type].where !== where) continue;
        const use = Math.min(w, problemNeed(c, pr) - pr.done);
        pr.done += use; w -= use; did = true;
        pr.by = pr.by || []; if (!pr.by.includes(p.name)) pr.by.push(p.name);
        if (pr.done >= problemNeed(c, pr) - 1e-9) pr.fixed = true;
      }
      if (!did) idle.push(p);
    }
    return idle;
  };
  const task = ch ? ch.task : null, picked = ch ? ch.crew : [];
  const special = id => picked.includes(id) && (task === 'chance' || task === 'cover' || task === 'polish');
  // кому нечего чинить — простаивает: это не тяжёлая работа и не отдых
  for (const p of repair('inside', withJob('fix'))) { say(p.name + ' had nothing to fix', 'nothing is broken inside'); jobs[p.id] = 'idle'; }
  for (const p of repair('outside', withJob('outside').filter(p => !special(p.id)))) {
    const n = workPower(c, p, 'outside'); s.samples = r3(s.samples + n);
    say('Samples ' + signed(n), p.name + ' went outside');
  }
  for (const pr of s.problems) {
    const pd = c.PROBLEMS[pr.type];
    if (pr.fixed) { say(pd.name + ' fixed!', 'repair by ' + pr.by.join(' and ')); if (pd.airOnFix) air(pd.airOnFix, pd.name.toLowerCase() + ' works again', 'fix'); }
    else if (pr.by && pr.by.length) say(pd.name + ': repair ' + fmt(pr.done) + ' of ' + fmt(problemNeed(c, pr)), pr.by.join(' and ') + ' worked on it');
    delete pr.by;
  }
  s.problems = s.problems.filter(pr => !pr.fixed);

  // 2) теплица
  const lamp = s.problems.find(p => p.type === 'lamp_fault'), lf = lamp ? c.PROBLEMS.lamp_fault.growthFactor[lamp.severity - 1] : 1;
  let steps = 0;
  if (cells.greenhouse > 0) {
    const st = cells.greenhouse * c.STEPS_PER_GREENHOUSE_CELL * lf; steps += st;
    say('Crop +' + plural(st, 'step'), plural(cells.greenhouse, 'greenhouse cell') + (lamp ? ', lamps are faulty' : ''));
  } else say('Crops wait', 'greenhouse dark');
  for (const p of withJob('grow')) {
    if (cells.greenhouse > 0 || !c.GROW_NEEDS_LIGHT) { const st = workPower(c, p, 'grow'); steps += st; say('Crop +' + plural(st, 'step'), p.name + ' tended the plants'); }
    else say(p.name + ' could not grow', 'greenhouse dark');
  }
  s.crop = r3(s.crop + steps);
  while (s.crop >= c.CROP_STEPS_TO_HARVEST - 1e-9) {
    s.crop = Math.max(0, r3(s.crop - c.CROP_STEPS_TO_HARVEST)); rec.harvests++; s.counters.harvests++;
    food(c.HARVEST_FOOD, 'harvest: crop reached ' + c.CROP_STEPS_TO_HARVEST + ' steps');
  }

  // 3) лаборатория
  const labOn = isUnlocked(s, 'lab') && cells.lab >= c.SYSTEMS.lab.want;
  for (const p of withJob('lab')) {
    if (!labOn) { say(p.name + ': no lab work', 'lab dark'); continue; }
    if (s.samples < 1) { say(p.name + ': no lab work', 'no samples to study'); continue; }
    s.labWork = r3(s.labWork + workPower(c, p, 'lab'));
    let made = false;
    while (s.labWork >= c.LAB_WORK_PER_SAMPLE - 1e-9 && s.samples >= 1) {
      s.labWork = Math.max(0, r3(s.labWork - c.LAB_WORK_PER_SAMPLE)); s.samples = r3(s.samples - 1); made = true;
      const next = CARDS.find(k => k.kind === 'lab' && !s.cards.found.includes(k.id));
      if (next) findCard(s, next.id, say, p.name + ' studied a sample');
      else say('Sample studied: nothing new', 'all lab cards are found');
    }
    if (!made) say('Sample half studied', p.name + ' worked in the lab');
  }
  if (s.samples < 1) s.labWork = 0;

  // 4) исход шанса и задачи снаружи
  if (ev && ev.kind === 'chance' && ev.id !== 'clean_wind') {
    if (ch.id === 'outside') {
      const p = crewById(s, picked[0]);
      findCard(s, ev.def.card, say, p.name + ' went outside for it');
      s.samples = r3(s.samples + c.CHANCE_SAMPLES); say('Samples ' + signed(c.CHANCE_SAMPLES), p.name + ' brought one back');
    } else if (ch.id === 'scan') {
      if (labOn && withJob('scan').length) findCard(s, ev.def.card, say, names(withJob('scan')) + ' scanned it from the lab');
      else say('Scan failed', 'lab dark');
    } else say('Chance gone', 'you let it go');
  }
  if (ev && ev.id === 'clean_wind') {
    if (ch.id === 'use_now') say('Cells +' + c.WIND_BONUS_CELLS + ' today', 'wind cleaned the panels');
    else if (ch.id === 'polish') { s.panelBoost = { cells: c.WIND_POLISH_CELLS, until: s.sol + c.WIND_POLISH_SOLS }; say('Cells +' + c.WIND_POLISH_CELLS + ' for ' + c.WIND_POLISH_SOLS + ' sols', crewById(s, picked[0]).name + ' polished the panels'); }
    else say('Chance gone', 'you let it go');
  }
  if (ev && ev.id === 'dust_storm') {
    if (ch.id === 'cover') { s.flags.panelsCovered = true; say('Panels tilted against the dust', crewById(s, picked[0]).name + ' went outside'); }
    else say('Panels left in the dust', 'you waited it out');
  }

  // 5) уход за больными: вся помощь идёт первому пациенту
  const carers = withJob('care'), careFor = {};
  if (carers.length) {
    const pts = carers.reduce((a, p) => a + workPower(c, p, 'care'), 0);
    const pat = s.crew.filter(p => jobs[p.id] === 'medbay').sort((a, b) => b.medbay - a.medbay)[0] || s.crew.find(p => p.sick && jobs[p.id] === 'rest');
    if (pat) careFor[pat.id] = pts; else say(names(carers) + ' had nobody to care for', 'nobody is ill');
  }

  // 6) воздух и вода
  const miss = c.SYSTEMS.life.want - cells.life;
  if (miss > 0) air(-miss * c.AIR_LOSS_PER_MISSING_CELL, 'life support ' + plural(miss, 'cell') + ' short', 'life');
  else if (miss < 0) air(-miss * c.AIR_GAIN_PER_EXTRA_CELL, 'extra life support cell', 'extra');
  for (const pr of s.problems) { const pd = c.PROBLEMS[pr.type]; if (pd.airLeak) air(-pd.airLeak * pr.severity, pd.name.toLowerCase() + ' leaks', pr.type); }
  // 7) еда
  food(-c.FOOD_EATEN_PER_SOL, 'the crew ate');

  // 8) радиация
  if (storm) say('Solar storm: dose x' + storm.mult + ' without shield', cells.shield >= c.SYSTEMS.shield.want ? 'shield at full power: minimum dose inside' : 'shield has ' + cells.shield + ' of ' + c.SYSTEMS.shield.want + ' cells');
  for (const p of s.crew) {
    const j = jobs[p.id], r = doseFor(c, storm, j, cells.shield), b0 = badgeOf(c, p.dose);
    p.dose = r3(p.dose + r.d); p.stormExtra = r3(p.stormExtra + r.extra);
    if (j === 'outside') p.trips++;
    const b1 = badgeOf(c, p.dose);
    if (b1 !== b0) {
      say(p.name + '\'s badge turned ' + b1, j === 'outside' ? 'trip outside' : r.extra > 0.01 ? 'storm with a weak shield' : 'dose adds up every sol');
      if (b1 === 'red' && c.RED_BADGE_GROUNDS) { p.grounded = true; say(p.name + ' stays inside from now on', 'red badge'); }
    }
  }

  // 9) состояния людей
  for (const p of s.crew) {
    const j = jobs[p.id];
    if (j === 'medbay') {
      p.medbaySols++; s.counters.medbaySols++;
      p.medbay = r3(p.medbay - c.MEDBAY_HEAL_PER_SOL - (careFor[p.id] || 0));
      if (p.medbay <= 1e-9) { p.medbay = 0; p.cond = 'fine'; p.sick = false; p.heavyStreak = 0; say(p.name + ' leaves the medbay', careFor[p.id] ? 'healed faster with care' : 'healed'); }
      else say(p.name + ' stays in the medbay', plural(Math.ceil(p.medbay), 'more sol'));
      continue;
    }
    if (p.sick) {
      if (j === 'rest') {
        p.sickRest = r3(p.sickRest + 1 + (careFor[p.id] || 0)); p.heavyStreak = 0;
        if (p.sickRest >= c.SICK_REST_SOLS_TO_CURE - 1e-9) { p.sick = false; p.sickRest = 0; p.cond = 'fine'; say(p.name + ' is well again', careFor[p.id] ? 'bed rest and care' : 'bed rest'); }
        else say(p.name + ' rests in the bunk', 'one more rest sol needed');
      } else { enterMedbay(s, p, c.SICK_WORK_MEDBAY_STEPS, 'working while ill'); say(p.name + ' got worse: medbay', 'worked while ill'); }
      continue;
    }
    if (c.HEAVY_JOBS.includes(j)) {
      if (p.cond === 'tired' && c.TIRED_HEAVY_WORK_INJURES) {
        enterMedbay(s, p, c.INJURY_MEDBAY_STEPS, j === 'outside' ? 'a trip outside while tired' : 'heavy work while tired');
        say(p.name + ' got hurt: medbay', 'heavy work while tired');
      } else {
        p.heavyStreak++;
        if (p.heavyStreak >= c.HEAVY_SOLS_TO_TIRED && p.cond !== 'tired') { p.cond = 'tired'; say(p.name + ' is tired', c.HEAVY_SOLS_TO_TIRED + ' heavy sols in a row'); }
      }
    } else {
      p.heavyStreak = 0;
      if (j === 'rest' && p.cond === 'tired') { p.cond = 'fine'; say(p.name + ' is rested', 'took a rest sol'); }
    }
  }

  // 10) запущенные поломки растут
  for (const pr of s.problems) {
    const pd = c.PROBLEMS[pr.type]; pr.age++;
    if (pd.growEvery > 0 && pr.age % pd.growEvery === 0 && pr.severity < pd.maxSeverity) { pr.severity++; say(pd.name + ' grew worse', 'left open for ' + plural(pr.age, 'sol')); }
  }
  if (ch && ch.id === 'tomorrow' && ev.def.problem) s.flags.prefill = ev.def.problem;

  // 11) карточки-вехи
  const next = dayOf(s, s.sol + 1);
  if (rec.harvests > 0) findCard(s, 'space_radishes', say, 'first harvest');
  if (day.storm && !(next && next.storm)) findCard(s, 'storm_survived', say, 'the solar storm passed');
  if (day.weather === 'dust' && !(next && next.weather === 'dust')) findCard(s, 'dust_survived', say, 'the dust storm passed');
  if (isBlackout(s) && !isBlackout(s, s.sol + 1)) findCard(s, 'conjunction', say, 'the radio blackout ended');

  // 12) неиспользованные ячейки
  const unused = rec.supply - planTotal(s.plan);
  if (unused > 0) {
    if (c.BATTERY_CAPACITY > 0) { s.battery = Math.min(c.BATTERY_CAPACITY, unused); say(plural(s.battery, 'cell') + ' saved in the battery', 'not shared out'); if (unused > s.battery) say(plural(unused - s.battery, 'cell') + ' lost at sunset', 'battery is full'); }
    else say(plural(unused, 'cell') + ' lost at sunset', 'not shared out');
  }

  // 13) проверка поражения
  s.counters.airZero = s.air <= 0 ? s.counters.airZero + 1 : 0;
  s.counters.foodZero = s.food <= 0 ? s.counters.foodZero + 1 : 0;
  if (s.counters.airZero >= c.ZERO_SOLS_TO_LOSE) s.over = { won: false, why: 'air' };
  else if (s.counters.foodZero >= c.ZERO_SOLS_TO_LOSE) s.over = { won: false, why: 'food' };
  else if (s.counters.airZero || s.counters.foodZero) say('Warning: a tank is empty', 'one more empty sol ends the mission');

  s.log.push(rec); s.lastResults = R;
  go(s, PHASE.RESULTS);
  return { state: s, results: R };
}
// Превью «что будет вечером» — тот же движок на клоне; нераскрытое событие не подсматривается.
function previewSol(state) {
  const s = clone(state);
  if (!s.today.revealed) { const d = s.schedule[s.sol - 1]; d.kind = 'quiet'; d.eventId = null; }
  return playSol(s).state;
}

function radioCanSend(s) {
  const c = cfg(s.mode), last = s.log[s.log.length - 1];
  return isUnlocked(s, 'radio') && !isBlackout(s) && !radioBlocked(s) && !!last && last.sol === s.sol && last.cells.radio >= c.SYSTEMS.radio.want;
}
function radioOffReason(s) {
  const c = cfg(s.mode), last = s.log[s.log.length - 1];
  if (!isUnlocked(s, 'radio')) return 'The radio opens on sol ' + c.SYSTEMS.radio.unlockSol + '.';
  if (isBlackout(s)) return 'Radio blackout: the Sun is between Mars and Earth.';
  if (radioBlocked(s)) return 'No radio: the antenna is off.';
  if (!last || last.cells.radio < c.SYSTEMS.radio.want) return 'No message tonight: the radio had no cell.';
  return '';
}
function messageOptions(s) {
  const c = cfg(s.mode), unsent = s.cards.found.filter(id => !s.cards.sent.includes(id));
  const firstBonus = s.radio.sent === 0 && !s.cards.found.includes('first_call') ? c.SCIENCE_PER_CARD.milestone : 0;
  const pts = unsent.reduce((a, id) => a + c.SCIENCE_PER_CARD[cardDef(id).kind], 0) + firstBonus;
  const ill = s.crew.some(p => p.medbay > 0 || p.sick);
  return [
    { id: 'forecast', label: 'What will space weather be like?', plus: 'Forecast for ' + c.RADIO_FORECAST_SOLS + ' sols, at breakfast', minus: 'Uses tonight\'s message', enabled: true, why: '' },
    { id: 'fix', label: 'How can we fix it faster?', plus: 'The open repair needs less work', minus: 'Uses tonight\'s message', enabled: s.problems.length > 0, why: 'Nothing is broken' },
    { id: 'doctors', label: 'Ask the doctors', plus: 'A patient heals one sol sooner', minus: 'Uses tonight\'s message', enabled: ill, why: 'Nobody is ill' },
    { id: 'science', label: 'Send our science report', plus: plural(unsent.length + (firstBonus ? 1 : 0), 'card') + ' sent: +' + pts + ' science', minus: 'No question tonight, no forecast', enabled: unsent.length > 0, why: 'No new cards to send' },
  ];
}
function endOrNext(s) {
  const c = cfg(s.mode);
  if (s.sol >= c.MISSION_SOLS) { s.over = { won: true, why: 'ship' }; return go(s, PHASE.REPORT); }

}
function proceed(state) { // results → radio | следующее утро | отчёт
  if (state.phase !== PHASE.RESULTS) return state;

}

  const s = clone(state), c = cfg(s.mode), opt = messageOptions(s).find(m => m.id === messageId);
  if (opt && opt.enabled) {
    if (s.radio.sent === 0) findCard(s, 'first_call');
    s.radio.sent++;
    if (messageId === 'science') {
      const unsent = s.cards.found.filter(id => !s.cards.sent.includes(id));
      for (const id of unsent) { s.cards.sent.push(id); s.science += c.SCIENCE_PER_CARD[cardDef(id).kind]; }
    }

}

// --- итог миссии ---
function matteredMost(s) {
  const c = cfg(s.mode);
  if (!s.over || s.over.won) return '';
  if (s.over.why === 'food') {
    const want = c.SYSTEMS.greenhouse.want; let best = null, run = null;
    for (const r of s.log) {
      if (r.cells.greenhouse < want) {
        if (!run) run = { a: r.sol, b: r.sol, zero: true };
        run.b = r.sol; if (r.cells.greenhouse > 0) run.zero = false;
        if (!best || run.b - run.a > best.b - best.a) best = Object.assign({}, run);
      } else run = null;
    }
    if (best) return 'The greenhouse had ' + (best.zero ? 'no' : 'too little') + ' power on sol' + (best.a === best.b ? ' ' + best.a : 's ' + best.a + '–' + best.b) + '.';
    return 'Only ' + plural(s.counters.harvests, 'harvest') + ' came in. More hands in the greenhouse would help.';
  }
  const sums = {};
  for (const r of s.log) for (const a of r.air) if (a.d < 0) { const k = sums[a.key] || (sums[a.key] = { lost: 0, sols: 0 }); k.lost -= a.d; k.sols++; }
  const top = Object.keys(sums).sort((a, b) => sums[b].lost - sums[a].lost)[0];
  if (!top) return 'Air & water ran out.';
  if (top === 'life') return 'Life support was short of power on ' + plural(sums[top].sols, 'sol') + ' (−' + fmt(sums[top].lost) + ' air & water).';
  return 'The ' + c.PROBLEMS[top].name.toLowerCase() + ' leaked for ' + plural(sums[top].sols, 'sol') + ' (−' + fmt(sums[top].lost) + ' air & water). Fix it early.';
}
function endMission(s) {
  const c = cfg(s.mode), won = !!(s.over && s.over.won);
  const badges = s.crew.map(p => badgeOf(c, p.dose));
  const noMed = s.counters.medbaySols === 0, allGreen = badges.every(b => b === 'green');
  const third = c.THIRD_STAR_RULE === 'medbay' ? noMed : c.THIRD_STAR_RULE === 'green' ? allGreen : noMed && allGreen;
  const stars = [won, s.science >= c.SCIENCE_TARGET, won && third], hints = ['', '', ''];
  if (!stars[0]) hints[0] = matteredMost(s);
  if (!stars[1]) {
    const unsent = s.cards.found.filter(id => !s.cards.sent.includes(id));
    const pot = s.science + unsent.reduce((a, id) => a + c.SCIENCE_PER_CARD[cardDef(id).kind], 0);
    hints[1] = pot >= c.SCIENCE_TARGET ? plural(unsent.length, 'card') + ' never went home. Send the science report.'
      : 'Only ' + plural(s.cards.found.length, 'card') + ' found. Take chances and power the lab.';
  }
  if (!stars[2]) {
    const m = s.crew.find(p => p.medbaySols > 0), i = badges.findIndex(b => b !== 'green');
    if (!won) hints[2] = 'Reach sol ' + c.MISSION_SOLS + ' first.';
    else if (m && c.THIRD_STAR_RULE !== 'green') hints[2] = m.name + ' spent ' + plural(m.medbaySols, 'sol') + ' in the medbay after ' + m.medbayCause + '.';
    else if (i >= 0) hints[2] = s.crew[i].name + '\'s badge turned ' + badges[i] + ': ' + plural(s.crew[i].trips, 'trip') + ' outside' + (s.crew[i].stormExtra > 0.01 ? ' and storm dose.' : '.');
  }
  const real = [];
  for (const d of s.schedule) if (d.sol <= s.sol) for (const e of d.real) real.push(Object.assign({ sol: d.sol }, e));
  return {
    won, why: s.over ? s.over.why : '', sol: s.sol, stars, hints, mattered: matteredMost(s),
    doses: s.crew.map((p, i) => ({ name: p.name, role: p.role, dose: p.dose, badge: badges[i], trips: p.trips, medbaySols: p.medbaySols })),
    science: s.science, target: c.SCIENCE_TARGET, found: s.cards.found.slice(), sent: s.cards.sent.slice(), real,
  };
}

/* ============================== 4. BOT + SELF-TEST ============================== */
function botPlan(s, style) {
  const c = cfg(s.mode), day = dayOf(s), cells = { life: 0, shield: 0, greenhouse: 0, radio: 0, lab: 0 }, jobs = {};
  let left = cellsAvailable(s);
  const give = (k, n) => { if (!isUnlocked(s, k)) return; const g = Math.max(0, Math.min(n, left, c.SYSTEMS[k].max - cells[k])); cells[k] += g; left -= g; };
  if (style === 'lazy') { give('shield', 3); give('lab', 2); give('radio', 1); for (const p of s.crew) jobs[p.id] = 'rest'; return { cells, jobs }; }
  give('life', c.SYSTEMS.life.want);
  if (day.storm) give('shield', c.SYSTEMS.shield.want);
  give('greenhouse', s.food <= 5 ? 3 : 2);
  if (!isBlackout(s) && !radioBlocked(s)) give('radio', 1);
  if (left >= c.SYSTEMS.lab.want && s.sol >= c.SYSTEMS.lab.unlockSol) give('lab', c.SYSTEMS.lab.want);
  give('greenhouse', 3);
  if (s.air < c.TANK_MAX - 1) give('life', 1);
  give('shield', 3);
  const inside = s.problems.some(p => c.PROBLEMS[p.type].where === 'inside'), outside = s.problems.some(p => c.PROBLEMS[p.type].where === 'outside');
  const ill = s.crew.some(p => p.medbay > 0 || p.sick);
  for (const p of s.crew) {
    let j = 'grow';
    const fit = p.cond !== 'tired' && !p.sick, canOut = fit && !p.grounded && !day.storm;
    const safeTrip = p.dose + c.DOSE_INDOOR_PER_SOL * (c.MISSION_SOLS - s.sol + 1) + c.DOSE_OUTSIDE_TRIP < c.BADGE_AMBER_MSV;
    if (!fit) j = 'rest';
    else if (p.role === 'engineer') j = inside ? 'fix' : outside && canOut ? 'outside' : 'grow';
    else if (p.role === 'medic') j = ill ? 'care' : 'grow';
    else if (p.role === 'scientist') j = cells.lab >= c.SYSTEMS.lab.want && s.samples >= 1 ? 'lab' : 'grow';
    else if (p.role === 'pilot') j = canOut && safeTrip && p.heavyStreak < 1 && s.sol >= c.SYSTEMS.lab.unlockSol ? 'outside' : 'grow';
    jobs[p.id] = j;
  }
  return { cells, jobs };
}
function botChoice(s, style) {
  const c = cfg(s.mode), ev = currentEvent(s), list = eventChoices(s).filter(x => x.enabled);
  const lastId = () => { const l = list.filter(x => !x.pick); return [l[l.length - 1].id, []]; };
  if (style !== 'careful') return lastId();
  const has = id => list.some(x => x.id === id);

  if (G.phase === PHASE.RADIO) return ['One message per sol, and only if the radio had a cell. Earth answers at breakfast.',
    'Science only counts for cards that were sent home with the science report.',
    'On sols ' + c.BLACKOUT_SOLS.join(' and ') + ' the Sun sits between Mars and Earth (solar conjunction), so the radio cannot reach Earth.',
    'Radio signals need 3 to 22 minutes one way, so nobody steers a Mars mission live. (Source: NASA/JPL)'];
  return [''];
}

  let y = 322;
  if (!r.won) { text('THE DECISION THAT MATTERED MOST', 24, y, 13, COL.dim, 'left', true); y = wrap(r.mattered, 24, y + 20, 600, 14, COL.warn, 18) + 12; }
  text('RADIATION DOSE OVER ' + r.sol + ' SOLS (millisievert, mSv = a unit for radiation dose)', 24, y, 13, COL.dim, 'left', true); y += 20;
  for (const d of r.doses) {
    text(d.name, 24, y, 14, '#fff', 'left', true); text(d.role, 90, y, 13, COL.dim);
    text(fmt2(d.dose) + ' mSv', 190, y, 14); text(d.badge.toUpperCase(), 290, y, 13, d.badge === 'green' ? COL.good : d.badge === 'amber' ? COL.warn : COL.bad, 'left', true);
    text(plural(d.trips, 'trip') + ' outside · ' + plural(d.medbaySols, 'sol') + ' in medbay', 360, y, 13, COL.dim); y += 20;
  }
  text('The game speeds time up: 15 sols stand for a much longer stay.', 24, y + 4, 12, COL.dim);
  text('SCIENCE SENT HOME: ' + r.science + ' / ' + r.target, 660, 322, 14, '#fff', 'left', true);
  text('Cards found ' + r.found.length + ', sent ' + r.sent.length + ' · album ' + ui.album.length + ' of ' + CARDS.length, 660, 342, 13, COL.dim);
  wrap(r.found.map(id => cardDef(id).title + (r.sent.includes(id) ? '' : ' (not sent)')).join(' · ') || 'no cards', 660, 362, 590, 12, COL.text, 16);
  let ry = 430;
  text('REAL NASA EVENTS IN YOUR MISSION', 660, ry, 13, COL.dim, 'left', true); ry += 20;
  for (const e of r.real.slice(0, 5)) { text('Sol ' + e.sol + ' · ' + e.date + ' · ' + e.label + ' · ' + e.source + (e.verified ? '' : ' (placeholder)'), 660, ry, 12, COL.warn); ry += 18; }
  if (!r.real.length) text('none reached', 660, ry, 12, COL.dim);
  button('again', 24, 630, 400, 64, 'SAME MARS AGAIN ▶', () => { setG(createMission(G.name, G.mode)); }, { primary: true, size: 18, bold: true });
  button('new', 440, 630, 300, 64, 'New mission', () => { G = null; ui.name = randomMissionName(); ui.focusId = 'name'; });
}

function drawHelper() {
  const c = cfg(G.mode), key = G.sol + ':' + G.phase;
  if (ui.helperKey !== key) { ui.helperKey = key; ui.helperOn = false; }
  panel(10, 606, 890, 104, 'STATION HELPER · explains, never decides');
  const on = c.HELPER_ALWAYS_ON || ui.helperOn;
  if (on) text(line15(helperLine()), 24, 660, 17, '#fff');
  else button('ask', 24, 640, 180, 40, 'Ask the helper', () => { ui.helperOn = true; });
  button('why', 790, 640, 100, 40, 'Why?', () => { ui.overlay = { title: 'WHY? · how this step works', lines: whyText() }; });
}

function drawOverlay() {
  const o = ui.overlay;
  g.fillStyle = 'rgba(0,0,0,0.78)'; g.fillRect(0, 0, W, H);
  rect(90, 40, 1100, 640, '#202020', '#fff', 2);
  text(o.title, 114, 78, 18, '#fff', 'left', true);
  let y = 110;
  for (const l of o.lines) {
    const col = l.indexOf('FAIL') === 0 ? COL.bad : l.indexOf('PASS') === 0 ? COL.good : COL.text;
    y = wrap(l, 114, y, 1050, o.small ? 12 : 15, col, o.small ? 15 : 22) + (o.small ? 1 : 8);
  }
  text('click or press Enter to close', 114, 664, 12, COL.dim);
}

function debugLines() {
  const lines = ['Seed "' + G.seed + '" · phase ' + G.phase + ' · air0 ' + G.counters.airZero + ' food0 ' + G.counters.foodZero + ' · labWork ' + G.labWork + ' · battery ' + G.battery];
  for (const d of G.schedule) lines.push((d.sol === G.sol ? '> ' : '  ') + 'sol ' + d.sol + ' · ' + d.kind + (d.eventId ? ':' + d.eventId : '') + ' · ' + d.weather + (d.storm ? ' · STORM day ' + (d.storm.day + 1) : '') + (d.real.length ? ' · real: ' + d.real.map(e => e.date + ' ' + e.label).join('; ') : ''));
  lines.push('Problems: ' + (JSON.stringify(G.problems) || '[]'));
  lines.push('Crew: ' + G.crew.map(p => p.name + ' ' + fmt2(p.dose) + ' streak' + p.heavyStreak + (p.sick ? ' sick' + p.sickRest : '')).join(' | '));
  return lines;
}

function render() {
  ui.hits = [];
  g.setTransform(ui.px, 0, 0, ui.px, 0, 0);
  g.fillStyle = COL.bg; g.fillRect(0, 0, W, H);
  if (!G) drawTitle();
  else {
    drawHUD();
    if (G.phase === PHASE.REPORT) drawReport();
    else {
      ({ briefing: drawBriefing, plan: drawPlan, event: drawEvent, results: drawResults, radio: drawRadio })[G.phase]();
      drawCrew(); drawHelper();
    }
  }
  if (ui.overlay) { ui.hits = []; drawOverlay(); }
}

// --- ввод ---
function resize() {
  const k = Math.min(window.innerWidth / W, window.innerHeight / H), dpr = window.devicePixelRatio || 1;
  cv.style.width = Math.floor(W * k) + 'px'; cv.style.height = Math.floor(H * k) + 'px';
  ui.px = Math.max(0.5, k * dpr);
  cv.width = Math.round(W * ui.px); cv.height = Math.round(H * ui.px);
  render();
}
function toLocal(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
function hitAt(p) { for (let i = ui.hits.length - 1; i >= 0; i--) { const h = ui.hits[i]; if (p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h) return h; } return null; }
cv.addEventListener('pointerdown', e => {
  if (ui.overlay) { ui.overlay = null; render(); return; }
  const h = hitAt(toLocal(e));
  if (h && h.en) { ui.focusId = h.id; h.fn(); } else if (!G) ui.focusId = null;
  render();
});
cv.addEventListener('pointermove', e => { const h = hitAt(toLocal(e)), id = h && h.en ? h.id : null; if (id !== ui.hoverId) { ui.hoverId = id; cv.style.cursor = id ? 'pointer' : 'default'; render(); } });
function autoPlaySol() { // бот доигрывает текущий сол до следующего утра
  if (!G || G.phase === PHASE.REPORT) return;
  let s = G, guard = 0; const sol = s.sol;
  do { s = botStep(s, 'careful'); } while (s.phase !== PHASE.REPORT && !(s.phase === PHASE.BRIEFING && s.sol !== sol) && guard++ < 20);
  setG(s);
}
window.addEventListener('keydown', e => {
  const k = e.key;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (ui.overlay) { if (k === 'Escape' || k === 'Enter' || k === ' ') { ui.overlay = null; e.preventDefault(); render(); } return; }
  if (!G && ui.focusId === 'name') {
    if (k.length === 1 && /[a-zA-Z0-9 ]/.test(k)) { if (ui.name.length < 22) ui.name += k; e.preventDefault(); render(); return; }
    if (k === 'Backspace') { ui.name = ui.name.slice(0, -1); e.preventDefault(); render(); return; }
    if (k === 'Enter') { const h = ui.hits.find(x => x.id === 'launch'); if (h) h.fn(); e.preventDefault(); render(); return; }
  }
  const list = ui.hits.filter(h => h.en), idx = list.findIndex(h => h.id === ui.focusId);
  if (k === 'Tab' || k === 'ArrowRight' || k === 'ArrowDown' || k === 'ArrowLeft' || k === 'ArrowUp') {
    const back = (k === 'Tab' && e.shiftKey) || k === 'ArrowLeft' || k === 'ArrowUp';
    if (list.length) ui.focusId = list[idx < 0 ? (back ? list.length - 1 : 0) : (idx + (back ? -1 : 1) + list.length) % list.length].id;
    e.preventDefault(); render(); return;
  }
  if (k === 'Enter' || k === ' ') { const h = idx >= 0 ? list[idx] : list.find(x => x.primary); if (h) h.fn(); e.preventDefault(); render(); return; }
  if (k === 'd' || k === 'D') { if (G && !ui.debug) { ui.debug = true; ui.overlay = { title: 'DEBUG · full schedule and hidden numbers (D again turns debug off)', lines: debugLines(), small: true }; } else ui.debug = false; render(); return; }
  if (k === 't' || k === 'T') {
    const res = selfTest(), fails = res.filter(r => !r.pass).length;
    ui.overlay = { title: 'SELF-TEST · ' + (res.length - fails) + ' of ' + res.length + ' passed', lines: res.map(r => (r.pass ? 'PASS ' : 'FAIL ') + r.name + (r.detail ? '  [' + r.detail + ']' : '')), small: true };
    render(); return;
  }
  if (k === 'a' || k === 'A') { autoPlaySol(); render(); return; }
});
window.addEventListener('resize', resize);

// --- запуск ---
ui.album = store.get('marsOutpost.album') || [];
ui.hasSave = !!store.get('marsOutpost.save');
window.MarsOutpost = {
  CONFIG, MODE_OVERRIDES, PHASE, TRANSITIONS,
  createMission, getMorning, startPlanning, applyPlan, confirmPlan, backToPlan, eventChoices, resolveEvent, clearChoice, playSol, previewSol, proceed, messageOptions, sendMessage, endMission,
  runMission, selfTest, balanceReport, botStep,
  get state() { return G; }, set state(s) { G = s; render(); }, render,
};
resize();
cv.focus();
</script>
</body>
</html>
